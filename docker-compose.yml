version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sana_algorithms
      POSTGRES_USER: sana_user
      POSTGRES_PASSWORD: sana_pass_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sana_user:sana_pass_dev@postgres:5432/sana_algorithms
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
