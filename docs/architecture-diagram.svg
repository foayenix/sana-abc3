  <rect x="770" y="550" width="380" height="120" rx="10" fill="#E8EAF6" stroke="#7986CB" stroke-width="2"/>
  <text x="820" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#303F9F">INFRASTRUCTURE</text>

  <!-- Docker -->
  <rect x="790" y="590" width="110" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="845" y="615" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#303F9F" text-anchor="middle">Docker</text>
  <text x="845" y="635" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Containers</text>

  <!-- CI/CD -->
  <rect x="910" y="590" width="110" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="965" y="615" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#303F9F" text-anchor="middle">GitHub</text>
  <text x="965" y="635" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">CI/CD Actions</text>

  <!-- Cloud -->
  <rect x="1030" y="590" width="110" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="1085" y="615" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#303F9F" text-anchor="middle">AWS/GCP</text>
  <text x="1085" y="635" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Cloud Deploy</text>

  <!-- Third Party Integrations -->
  <rect x="800" y="110" width="330" height="80" rx="8" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1"/>
  <text x="965" y="135" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#F57F17" text-anchor="middle">THIRD-PARTY INTEGRATIONS</text>
  <text x="850" y="158" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Stripe</text>
  <text x="920" y="158" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Firebase</text>
  <text x="990" y="158" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">SendGrid</text>
  <text x="1060" y="158" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Sentry</text>
  <text x="885" y="178" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">AWS S3</text>
  <text x="965" y="178" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Google Fonts</text>
  <text x="1045" y="178" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Crashlytics</text>

  <!-- Connection arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Vertical connections -->
  <line x1="160" y1="190" x2="160" y2="270" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="210" x2="400" y2="270" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="180" y1="330" x2="180" y2="410" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="330" x2="400" y2="410" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="520" x2="300" y2="590" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Footer -->
  <text x="600" y="700" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">SANA Health Platform © 2024 | Cloud-Native Architecture | GDPR Compliant</text>

  <!-- Key metrics -->
  <rect x="50" y="720" width="1100" height="60" rx="8" fill="url(#primaryGrad)"/>
  <text x="150" y="750" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">22 Screens</text>
  <text x="350" y="750" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">6 Core Services</text>
  <text x="550" y="750" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Real-time Messaging</text>
  <text x="750" y="750" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">CI/CD Pipeline</text>
  <text x="950" y="750" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Cloud-Ready</text>
  <text x="1100" y="750" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">5000+ Lines</text>
</svg>
