  <text x="620" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565C0" text-anchor="middle">Authentication</text>
  <text x="620" y="315" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">JWT / OAuth 2.0</text>

