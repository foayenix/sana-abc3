  <rect x="80" y="410" width="130" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="145" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100" text-anchor="middle">User Service</text>
  <text x="145" y="448" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Profiles, Auth</text>

  <rect x="220" y="410" width="130" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="285" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100" text-anchor="middle">Practitioner</text>
  <text x="285" y="448" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Search, Booking</text>

  <rect x="360" y="410" width="130" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="425" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100" text-anchor="middle">Session Service</text>
  <text x="425" y="448" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Bookings, Calendar</text>

  <rect x="500" y="410" width="130" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="565" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100" text-anchor="middle">Health Service</text>
  <text x="565" y="448" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Tracking, Scores</text>

  <rect x="640" y="410" width="130" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="705" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100" text-anchor="middle">Messaging</text>
  <text x="705" y="448" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Chat, Notifications</text>

  <rect x="780" y="410" width="130" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="845" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100" text-anchor="middle">Payment</text>
  <text x="845" y="448" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Stripe Integration</text>

