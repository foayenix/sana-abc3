  <rect x="300" y="270" width="200" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="400" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565C0" text-anchor="middle">WebSocket Server</text>
  <text x="400" y="315" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Real-time Messaging</text>

