  <text x="155" y="615" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C2185B" text-anchor="middle">PostgreSQL</text>
  <text x="155" y="635" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Primary Database</text>

  <!-- Redis -->
  <rect x="250" y="590" width="150" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="325" y="615" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C2185B" text-anchor="middle">Redis</text>
  <text x="325" y="635" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Cache &amp; Sessions</text>

