  <rect x="420" y="590" width="150" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="495" y="615" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C2185B" text-anchor="middle">Alembic</text>
  <text x="495" y="635" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">DB Migrations</text>

