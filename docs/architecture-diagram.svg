<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#345519;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58AA55;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#345519" text-anchor="middle">SANA Health Platform - Technical Architecture</text>

  <!-- Client Layer -->
  <rect x="50" y="70" width="1100" height="140" rx="10" fill="#E8F5E9" stroke="#A5BE5E" stroke-width="2"/>
  <text x="100" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#345519">CLIENT LAYER</text>

  <!-- Mobile App -->
  <rect x="80" y="110" width="160" height="80" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="160" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#345519" text-anchor="middle">Mobile App</text>
  <text x="160" y="158" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Flutter / Dart</text>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="9" fill="#888" text-anchor="middle">iOS &amp; Android</text>

  <!-- Web Dashboard -->
  <rect x="260" y="110" width="160" height="80" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="340" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#345519" text-anchor="middle">Admin Dashboard</text>
  <text x="340" y="158" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Flutter Web</text>
  <text x="340" y="175" font-family="Arial, sans-serif" font-size="9" fill="#888" text-anchor="middle">Management Portal</text>

  <!-- Practitioner App -->
  <rect x="440" y="110" width="160" height="80" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="520" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#345519" text-anchor="middle">Practitioner App</text>
  <text x="520" y="158" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Flutter / Dart</text>
  <text x="520" y="175" font-family="Arial, sans-serif" font-size="9" fill="#888" text-anchor="middle">Provider Interface</text>

  <!-- State Management -->
  <rect x="620" y="110" width="160" height="80" rx="8" fill="#F3E5F5" filter="url(#shadow)"/>
  <text x="700" y="135" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7B1FA2" text-anchor="middle">State Management</text>
  <text x="700" y="155" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Riverpod</text>
  <text x="700" y="170" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">GoRouter</text>
  <text x="700" y="185" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Secure Storage</text>

  <!-- API Layer -->
