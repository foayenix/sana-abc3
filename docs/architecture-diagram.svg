  <text x="145" y="490" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100" text-anchor="middle">Email Service</text>
  <text x="145" y="508" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">SendGrid</text>

  <rect x="220" y="470" width="130" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="285" y="490" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100" text-anchor="middle">File Upload</text>
  <text x="285" y="508" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">AWS S3</text>

  <rect x="360" y="470" width="130" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="425" y="490" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100" text-anchor="middle">Analytics</text>
  <text x="425" y="508" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Firebase Analytics</text>

