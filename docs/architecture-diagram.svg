  <text x="100" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565C0">API GATEWAY LAYER</text>

  <!-- REST API -->
  <rect x="80" y="270" width="200" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="180" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565C0" text-anchor="middle">REST API</text>
  <text x="180" y="315" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">FastAPI / Python</text>

