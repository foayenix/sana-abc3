<svg width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="algoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#345519;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58AA55;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E65100"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#345519" text-anchor="middle">SANA Health Platform - Algorithm Flow Diagram</text>
  <text x="700" y="65" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">How Algorithms Connect and Data Flows Through the System</text>

  <!-- USER INPUT SECTION -->
  <rect x="50" y="90" width="300" height="180" rx="10" fill="#E8F5E9" stroke="#A5BE5E" stroke-width="2"/>
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#345519" text-anchor="middle">USER INPUT</text>

  <rect x="70" y="130" width="120" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="130" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#345519" text-anchor="middle">Registration</text>
  <text x="130" y="175" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Profile Data</text>

  <rect x="210" y="130" width="120" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="270" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#345519" text-anchor="middle">Questionnaire</text>
  <text x="270" y="175" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Health Survey</text>

  <rect x="70" y="200" width="260" height="50" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#345519" text-anchor="middle">User Preferences</text>
  <text x="200" y="238" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Budget, Location, Session Type</text>

  <!-- CORE ALGORITHMS SECTION -->
  <rect x="400" y="90" width="600" height="380" rx="10" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2"/>
  <text x="700" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle">CORE ALGORITHMS</text>

  <!-- SISM Algorithm -->
  <rect x="420" y="135" width="260" height="120" rx="8" fill="url(#algoGrad)" filter="url(#shadow)"/>
  <text x="550" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SISM</text>
  <text x="550" y="180" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Health Scoring Algorithm</text>
  <text x="550" y="200" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">5 Domains: Physical, Emotional,</text>
  <text x="550" y="215" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">Social, Cognitive, Spiritual</text>
  <text x="550" y="235" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">Output: Score (0-100) + Weak Domains</text>

  <!-- SPRM Algorithm -->
  <rect x="720" y="135" width="260" height="120" rx="8" fill="url(#algoGrad)" filter="url(#shadow)"/>
  <text x="850" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SPRM</text>
  <text x="850" y="180" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Practitioner Recommendation</text>
  <text x="850" y="200" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">4-Stage Filter: Verify → Specialty</text>
  <text x="850" y="215" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">→ Geography → Budget</text>
  <text x="850" y="235" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">Output: Top 5 Recommendations</text>

  <!-- SANA Index -->
  <rect x="420" y="280" width="260" height="120" rx="8" fill="url(#algoGrad)" filter="url(#shadow)"/>
  <text x="550" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SANA Index</text>
  <text x="550" y="325" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Practitioner Credibility Score</text>
  <text x="550" y="345" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">Credentials 20% | Volume 20%</text>
  <text x="550" y="360" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">Outcomes 40% | Profile 10%</text>
  <text x="550" y="380" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">Satisfaction 10%</text>

  <!-- SCVM Algorithm -->
  <rect x="720" y="280" width="260" height="120" rx="8" fill="url(#algoGrad)" filter="url(#shadow)"/>
  <text x="850" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SCVM</text>
  <text x="850" y="325" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Credential Verification</text>
  <text x="850" y="345" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">OCR + Pattern Matching</text>
  <text x="850" y="360" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">Fraud Detection</text>
  <text x="850" y="380" font-family="Arial, sans-serif" font-size="8" fill="#E8F5E9" text-anchor="middle">5 Verification Tiers</text>

  <!-- Scoring Formula Box -->
  <rect x="420" y="420" width="560" height="40" rx="6" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1"/>
  <text x="700" y="445" font-family="monospace" font-size="9" fill="#E65100" text-anchor="middle">SPRM Score = (HealthNeed×0.4) + (SANA Index×0.25) + (PracticalFit×0.2) + (Evidence×0.1) + (Pref×0.05)</text>

  <!-- BUSINESS SERVICES SECTION -->
  <rect x="1050" y="90" width="300" height="380" rx="10" fill="#E3F2FD" stroke="#64B5F6" stroke-width="2"/>
  <text x="1200" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle">BUSINESS SERVICES</text>

  <rect x="1070" y="135" width="120" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="1130" y="158" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1565C0" text-anchor="middle">Booking</text>
  <text x="1130" y="173" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Schedule Sessions</text>

  <rect x="1210" y="135" width="120" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="1270" y="158" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1565C0" text-anchor="middle">Payment</text>
  <text x="1270" y="173" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Stripe Integration</text>

  <rect x="1070" y="200" width="120" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="1130" y="223" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1565C0" text-anchor="middle">Messaging</text>
  <text x="1130" y="238" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">WebSocket Chat</text>

  <rect x="1210" y="200" width="120" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="1270" y="223" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1565C0" text-anchor="middle">Notifications</text>
  <text x="1270" y="238" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Push + Email</text>

  <rect x="1070" y="265" width="260" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="1200" y="288" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1565C0" text-anchor="middle">Session Management</text>
  <text x="1200" y="303" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Video Call, Notes, Outcomes</text>

  <rect x="1070" y="330" width="260" height="50" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="1200" y="353" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1565C0" text-anchor="middle">Reviews &amp; Ratings</text>
  <text x="1200" y="368" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Client Feedback Collection</text>

  <rect x="1070" y="395" width="260" height="50" rx="6" fill="#E8F5E9" filter="url(#shadow)"/>
  <text x="1200" y="418" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2E7D32" text-anchor="middle">Outcome Tracking</text>
  <text x="1200" y="433" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Success Metrics → SANA Index</text>

  <!-- DATA FLOW SECTION -->
  <rect x="50" y="490" width="1300" height="200" rx="10" fill="#FCE4EC" stroke="#F48FB1" stroke-width="2"/>
  <text x="700" y="515" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2185B" text-anchor="middle">DATA FLOW &amp; STORAGE</text>

  <!-- Database boxes -->
  <rect x="80" y="535" width="140" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="150" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C2185B" text-anchor="middle">Users</text>
  <text x="150" y="580" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Profiles, Auth, Prefs</text>

  <rect x="240" y="535" width="140" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="310" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C2185B" text-anchor="middle">Health Scores</text>
  <text x="310" y="580" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">SISM Results</text>

  <rect x="400" y="535" width="140" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="470" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C2185B" text-anchor="middle">Practitioners</text>
  <text x="470" y="580" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Profiles, SANA Index</text>

  <rect x="560" y="535" width="140" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="630" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C2185B" text-anchor="middle">Bookings</text>
  <text x="630" y="580" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Appointments</text>

  <rect x="720" y="535" width="140" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="790" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C2185B" text-anchor="middle">Sessions</text>
  <text x="790" y="580" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Notes, Outcomes</text>

  <rect x="880" y="535" width="140" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="950" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C2185B" text-anchor="middle">Payments</text>
  <text x="950" y="580" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Transactions</text>

  <rect x="1040" y="535" width="140" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="1110" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C2185B" text-anchor="middle">Messages</text>
  <text x="1110" y="580" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Conversations</text>

  <rect x="1200" y="535" width="140" height="60" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="1270" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C2185B" text-anchor="middle">Reviews</text>
  <text x="1270" y="580" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Ratings, Feedback</text>

  <!-- Data Flow Description -->
  <rect x="80" y="610" width="1260" height="65" rx="6" fill="white" stroke="#F48FB1" stroke-width="1"/>
  <text x="700" y="632" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C2185B" text-anchor="middle">Primary Data Flow Chain</text>
  <text x="700" y="655" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Questionnaire → SISM → Health Score → Preferences → SPRM → Recommendations → Booking → Payment → Session → Review → SANA Index Update</text>

  <!-- FEEDBACK LOOP SECTION -->
  <rect x="50" y="710" width="1300" height="120" rx="10" fill="#E8EAF6" stroke="#7986CB" stroke-width="2"/>
  <text x="700" y="735" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#303F9F" text-anchor="middle">FEEDBACK LOOPS &amp; CONTINUOUS IMPROVEMENT</text>

  <!-- Feedback Loop 1 -->
  <rect x="80" y="755" width="380" height="55" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="270" y="775" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#303F9F" text-anchor="middle">Loop 1: Practitioner Quality</text>
  <text x="270" y="795" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Session Outcomes + Reviews → SANA Index → Better SPRM Rankings</text>

  <!-- Feedback Loop 2 -->
  <rect x="480" y="755" width="380" height="55" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="670" y="775" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#303F9F" text-anchor="middle">Loop 2: Health Progress</text>
  <text x="670" y="795" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Periodic Re-assessment → SISM → Track Score Changes Over Time</text>

  <!-- Feedback Loop 3 -->
  <rect x="880" y="755" width="380" height="55" rx="6" fill="white" filter="url(#shadow)"/>
  <text x="1070" y="775" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#303F9F" text-anchor="middle">Loop 3: Credential Freshness</text>
  <text x="1070" y="795" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">SCVM Re-verification → Updated Verification Tier → Trust Score</text>

  <!-- CONNECTION ARROWS -->

  <!-- User Input to SISM -->
  <path d="M 350 160 Q 385 160 420 175" stroke="#2E7D32" stroke-width="2" fill="none" marker-end="url(#greenArrow)"/>

  <!-- User Preferences to SPRM -->
  <path d="M 350 225 Q 500 225 500 200 Q 500 175 720 175" stroke="#2E7D32" stroke-width="2" fill="none" marker-end="url(#greenArrow)"/>

  <!-- SISM to SPRM -->
  <line x1="680" y1="195" x2="720" y2="195" stroke="#E65100" stroke-width="3" marker-end="url(#orangeArrow)"/>

  <!-- SANA Index to SPRM -->
  <path d="M 550 280 Q 550 260 680 260 Q 750 260 750 255" stroke="#E65100" stroke-width="2" fill="none" marker-end="url(#orangeArrow)"/>

  <!-- SCVM to SANA Index -->
  <line x1="720" y1="340" x2="680" y2="340" stroke="#E65100" stroke-width="2" marker-end="url(#orangeArrow)"/>

  <!-- SPRM to Services -->
  <line x1="980" y1="195" x2="1050" y2="165" stroke="#1565C0" stroke-width="2" marker-end="url(#blueArrow)"/>

  <!-- Services to Data -->
  <path d="M 1200 445 Q 1200 490 900 520" stroke="#C2185B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Outcome Tracking feedback to SANA Index -->
  <path d="M 1070 420 Q 800 420 680 400" stroke="#2E7D32" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#greenArrow)"/>

  <!-- Legend -->
  <rect x="50" y="850" width="1300" height="130" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="700" y="875" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">LEGEND</text>

  <!-- Algorithm types -->
  <rect x="80" y="895" width="20" height="20" rx="4" fill="url(#algoGrad)"/>
  <text x="110" y="910" font-family="Arial, sans-serif" font-size="10" fill="#333">Core Algorithm</text>

  <rect x="230" y="895" width="20" height="20" rx="4" fill="white" stroke="#64B5F6" stroke-width="2"/>
  <text x="260" y="910" font-family="Arial, sans-serif" font-size="10" fill="#333">Business Service</text>

  <rect x="400" y="895" width="20" height="20" rx="4" fill="white" stroke="#F48FB1" stroke-width="2"/>
  <text x="430" y="910" font-family="Arial, sans-serif" font-size="10" fill="#333">Data Storage</text>

  <!-- Arrow types -->
  <line x1="560" y1="905" x2="590" y2="905" stroke="#2E7D32" stroke-width="2" marker-end="url(#greenArrow)"/>
  <text x="600" y="910" font-family="Arial, sans-serif" font-size="10" fill="#333">User Data Flow</text>

  <line x1="730" y1="905" x2="760" y2="905" stroke="#E65100" stroke-width="3" marker-end="url(#orangeArrow)"/>
  <text x="770" y="910" font-family="Arial, sans-serif" font-size="10" fill="#333">Algorithm Connection</text>

  <line x1="920" y1="905" x2="950" y2="905" stroke="#1565C0" stroke-width="2" marker-end="url(#blueArrow)"/>
  <text x="960" y="910" font-family="Arial, sans-serif" font-size="10" fill="#333">Service Flow</text>

  <line x1="1080" y1="905" x2="1110" y2="905" stroke="#2E7D32" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#greenArrow)"/>
  <text x="1120" y="910" font-family="Arial, sans-serif" font-size="10" fill="#333">Feedback Loop</text>

  <!-- Key Stats -->
  <text x="700" y="960" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">4 Core Algorithms | 5-Factor Weighted Scoring | Real-time Feedback Loops | Continuous Credibility Updates</text>

</svg>
